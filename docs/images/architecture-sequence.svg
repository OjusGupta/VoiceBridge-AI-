<svg viewBox="0 0 1010 450" width="1010" role="img" aria-label="Request and response sequence" font-family="Inter,system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Participant headers -->
  <!-- User -->
  <rect x="8" y="10" width="124" height="30" rx="7" fill="#1f2937" stroke="#374151"/>
  <text x="70" y="30" text-anchor="middle" fill="#f3f4f6" font-weight="600" font-size="12">User</text>
  <line x1="70" y1="40" x2="70" y2="440" stroke="#374151" stroke-dasharray="4 5"/>

  <!-- Web UI -->
  <rect x="148" y="10" width="124" height="30" rx="7" fill="#1f2937" stroke="#374151"/>
  <text x="210" y="30" text-anchor="middle" fill="#f3f4f6" font-weight="600" font-size="12">Web UI</text>
  <line x1="210" y1="40" x2="210" y2="440" stroke="#374151" stroke-dasharray="4 5"/>

  <!-- API (FastAPI) -->
  <rect x="308" y="10" width="124" height="30" rx="7" fill="#1f2937" stroke="#374151"/>
  <text x="370" y="30" text-anchor="middle" fill="#f3f4f6" font-weight="600" font-size="12">API (FastAPI)</text>
  <line x1="370" y1="40" x2="370" y2="440" stroke="#374151" stroke-dasharray="4 5"/>

  <!-- ConversationManager -->
  <rect x="498" y="10" width="124" height="30" rx="7" fill="#1f2937" stroke="#374151"/>
  <text x="560" y="30" text-anchor="middle" fill="#f3f4f6" font-weight="600" font-size="12">ConversationManager</text>
  <line x1="560" y1="40" x2="560" y2="440" stroke="#374151" stroke-dasharray="4 5"/>

  <!-- ResponseGenerator -->
  <rect x="698" y="10" width="124" height="30" rx="7" fill="#1f2937" stroke="#374151"/>
  <text x="760" y="30" text-anchor="middle" fill="#f3f4f6" font-weight="600" font-size="12">ResponseGenerator</text>
  <line x1="760" y1="40" x2="760" y2="440" stroke="#374151" stroke-dasharray="4 5"/>

  <!-- TranscriptLogger -->
  <rect x="868" y="10" width="124" height="30" rx="7" fill="#1f2937" stroke="#374151"/>
  <text x="930" y="30" text-anchor="middle" fill="#f3f4f6" font-weight="600" font-size="12">TranscriptLogger</text>
  <line x1="930" y1="40" x2="930" y2="440" stroke="#374151" stroke-dasharray="4 5"/>

  <!-- Messages -->
  <!-- User → Web UI -->
  <path d="M70 70H206" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="140" y="64" text-anchor="middle" fill="#6b7280" font-size="11">type, or speak (browser speech-to-text)</text>

  <!-- Web UI → API -->
  <path d="M210 105H366" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="290" y="99" text-anchor="middle" fill="#6b7280" font-size="11">POST /messages (empty? rejected)</text>

  <!-- API → ConversationManager -->
  <path d="M370 140H556" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="463" y="134" text-anchor="middle" fill="#6b7280" font-size="11">process_message(text)</text>

  <!-- Self-loop: sanitise → intent → state -->
  <path d="M560 160h30v22h-30" fill="none" stroke="#6b7280"/>
  <text x="560" y="172" fill="#6b7280" font-size="11" text-anchor="middle">sanitise → intent → state</text>

  <!-- ConversationManager → ResponseGenerator -->
  <path d="M560 215H756" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="658" y="209" text-anchor="middle" fill="#6b7280" font-size="11">generate(state, intent)</text>

  <!-- ResponseGenerator → ConversationManager (dashed) -->
  <path d="M760 250H564" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="662" y="244" text-anchor="middle" fill="#6b7280" font-size="11">LLM reply or local template</text>

  <!-- Output safety check self-loop -->
  <path d="M560 270h30v22h-30" fill="none" stroke="#6b7280"/>
  <text x="560" y="283" fill="#6b7280" font-size="11" text-anchor="middle">output safety check (all modes)</text>

  <!-- ConversationManager → TranscriptLogger -->
  <path d="M560 320H926" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="743" y="314" text-anchor="middle" fill="#6b7280" font-size="11">log_turn (credentials redacted)</text>

  <!-- ConversationManager → API (dashed) -->
  <path d="M560 355H374" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="467" y="349" text-anchor="middle" fill="#6b7280" font-size="11">reply + state + intent</text>

  <!-- API → Web UI (dashed) -->
  <path d="M370 385H214" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="292" y="379" text-anchor="middle" fill="#6b7280" font-size="11">JSON response</text>

  <!-- Web UI → User (dashed) -->
  <path d="M210 420H74" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="140" y="414" text-anchor="middle" fill="#6b7280" font-size="11">show reply · speak it if enabled</text>
</svg>
